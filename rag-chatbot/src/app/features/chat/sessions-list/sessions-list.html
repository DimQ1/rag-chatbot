<div class="sessions-container">
  <div class="sessions-header">
    <h2>Chat Sessions</h2>
    <div class="sessions-header-actions">
      <button
        mat-icon-button
        matTooltip="New Chat"
        (click)="createNewSession()"
        [disabled]="loading()"
        class="new-chat-btn"
      >
        <mat-icon>add_circle_outline</mat-icon>
      </button>
    </div>
  </div>

  <div class="sessions-list" *ngIf="!loading()">
    <div class="sessions-items" *ngIf="(sessions | async)?.length; else noSessions">
      <div
        *ngFor="let session of sessions | async"
        [class.active]="(currentSessionId | async) === session.id"
        (click)="selectSession(session.id)"
        class="session-item"
      >
        <div class="session-content" title="{{ session.topic }}">
          <mat-icon *ngIf="session.isPinned" class="pin-icon">push_pin</mat-icon>
          <span class="session-topic">{{ session.topic }}</span>
          <span class="thinking-indicator" *ngIf="(currentThinkingSessionId | async) === session.id" aria-label="Assistant is thinking" title="Assistant is thinking">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
        </div>

        <div class="session-actions" (click)="$event.stopPropagation()">
          <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
            class="menu-btn"
          >
            <mat-icon>more_vert</mat-icon>
          </button>

          <mat-menu #menu="matMenu">
            <button
              mat-menu-item
              (click)="togglePin($event, session.id, session.isPinned)"
            >
              <mat-icon>{{ session.isPinned ? 'push_pin' : 'pin_outline' }}</mat-icon>
              <span>{{ session.isPinned ? 'Unpin' : 'Pin' }}</span>
            </button>
            <button
              mat-menu-item
              (click)="openRenameDialog($event, session)"
            >
              <mat-icon>edit</mat-icon>
              <span>Rename</span>
            </button>
            <mat-divider></mat-divider>
            <button
              mat-menu-item
              (click)="deleteSession($event, session.id)"
              class="delete-btn"
            >
              <mat-icon color="warn">delete</mat-icon>
              <span>Delete</span>
            </button>
          </mat-menu>
        </div>
      </div>
    </div>

    <ng-template #noSessions>
      <div class="no-sessions">
        <mat-icon>chat_bubble_outline</mat-icon>
        <p>No chat sessions yet</p>
        <button
          mat-raised-button
          color="primary"
          (click)="createNewSession()"
        >
          Start New Chat
        </button>
      </div>
    </ng-template>
  </div>

  <div class="loading" *ngIf="loading()">
    <mat-spinner diameter="30"></mat-spinner>
  </div>
</div>
